<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>500 — Server xatosi | Iymon</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      overflow: hidden;
      background: #072a16;
      color: #fff;
      font-family: Nunito, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .bg { position: fixed; inset: 0; background: url(/images/mosque.webp) center / cover; opacity: 0.6; }
    .shade { position: fixed; inset: 0; background: linear-gradient(to bottom, rgb(7 42 22 / 0.8), rgb(7 42 22 / 0.85), rgb(0 0 0 / 0.9)); }
    main { position: relative; width: 100%; max-width: 28rem; }
    .gold { background: linear-gradient(to bottom, #f7e3a3, #e9c46a, #d18f1f); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 32px; text-decoration: none; }
    .brand img { width: 40px; height: 40px; border-radius: 12px; object-fit: cover; }
    .brand span { font: 700 30px/1 'Cormorant Garamond', Georgia, serif; }
    .code { font: 800 clamp(5.5rem, 22vw, 7rem)/1 Poppins, system-ui, sans-serif; filter: drop-shadow(0 4px 24px rgb(224 160 46 / 0.35)); }
    h1 { margin-top: 12px; font: 800 clamp(1.5rem, 6vw, 1.875rem)/1.25 Poppins, system-ui, sans-serif; }
    .rule { margin: 16px auto 0; display: flex; justify-content: center; align-items: center; gap: 8px; color: #e0a02e; font-size: 12px; }
    .rule i { width: 48px; height: 1px; background: linear-gradient(to right, transparent, rgb(224 160 46 / 0.7)); }
    .rule i:last-child { transform: scaleX(-1); }
    p { margin: 16px auto 0; max-width: 24rem; font-size: 15px; line-height: 1.65; color: rgb(255 255 255 / 0.8); }
    .actions { margin-top: 32px; display: grid; gap: 12px; }
    @media (min-width: 400px) { .actions { grid-template-columns: 1fr 1fr; } }
    .btn { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; padding: 0 20px; font: 700 14px/1 inherit; font-family: inherit; color: #fff; text-decoration: none; cursor: pointer; border: 0; transition: filter 0.2s, background-color 0.2s; }
    .primary { background: linear-gradient(to right, #17743d, #10b981); box-shadow: 0 10px 24px rgb(6 78 59 / 0.4); }
    .primary:hover { filter: brightness(1.1); }
    .ghost { background: rgb(255 255 255 / 0.05); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.25); }
    .ghost:hover { background: rgb(255 255 255 / 0.1); }
    .btn:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>
  <main>
    <a class="brand" href="/" aria-label="Bosh sahifa"><img src="/images/iymon-logo.webp" alt="" /><span class="gold">Iymon</span></a>
    <div class="code gold">500</div>
    <h1>Serverda xatolik</h1>
    <div class="rule" aria-hidden="true"><i></i>✦<i></i></div>
    <p>Hozir so‘rovni bajarib bo‘lmadi. Bir necha daqiqadan so‘ng sahifani yangilab ko‘ring.</p>
    <div class="actions">
      <a class="btn primary" href="/">Bosh sahifaga qaytish</a>
      <button class="btn ghost" type="button" onclick="location.reload()">Qayta urinish</button>
    </div>
  </main>
</body>
</html>
