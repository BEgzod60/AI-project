server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 400 — Noto'g'ri so'rov: nginx'ning o'zi rad etgan so'rovlar va admin sahifalari uchun
    error_page 400 /400.html;

    location = /400.html {
        internal;
    }

    # 500 — backend ishlamasa (502/503/504) yoki admin'da server xatosi
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        internal;
    }

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # API — Django (gunicorn); xatolar JSON ko'rinishida o'zgarishsiz qaytadi (formalar shunga tayanadi)
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # Admin — Django; 400 javobi o'rniga chiroyli sahifa
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_intercept_errors on;
        error_page 400 /400.html;
        error_page 500 502 503 504 /50x.html;
    }

    # Django static (admin) va media (Qur'on audiolari) to'g'ridan-to'g'ri nginx'dan
    location /static/ {
        alias /srv/static/;
        expires 7d;
    }

    location /media/ {
        alias /srv/media/;
        expires 30d;
    }

    # Vite build: xeshlangan fayllar uzoq keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router (BrowserRouter) — noma'lum yo'llar index.html ga
    location / {
        try_files $uri $uri/ /index.html;
    }
}
