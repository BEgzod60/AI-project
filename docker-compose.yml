services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: ${APP_UID:-1000}
    env_file:
      - path: ./backend/.env
        required: true
    volumes:
      # Baza hozircha SQLite (host'dagi fayl), media — Qur'on audiolari va h.k.
      - ./backend/db.sqlite3:/app/db.sqlite3
      - ./backend/media:/app/media
      - static:/app/static
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    volumes:
      - static:/srv/static:ro
      - ./backend/media:/srv/media:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Telefonda sinash uchun vaqtinchalik HTTPS havola (kompas va joylashuv faqat HTTPS'da ishlaydi).
  # Faqat qo'lda: `docker compose --profile tunnel up tunnel` — havola logda chiqadi (*.trycloudflare.com).
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    profiles:
      - tunnel

volumes:
  static:
