# Portlar: standart port + 2000 (VPS'da boshqa loyihalar bilan to'qnashmasligi uchun)
#   web (nginx) 80   -> 2080   (host nginx test.iymanim.uz ni shu portga yo'naltiradi)
#   backend     8000 -> 10000  (faqat ichki tarmoqda)
#   postgres    5432 -> 7432   (faqat 127.0.0.1 da, ssh tunnel/backup uchun)
name: iymon

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iymon}
      POSTGRES_USER: ${POSTGRES_USER:-iymon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da berilishi kerak}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:7432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-iymon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-iymon}}
    volumes:
      - static:/app/static
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:2080:80"
    volumes:
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  static:
  media:
