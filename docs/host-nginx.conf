# docs/host-nginx.conf
# Ushbu konfiguratsiyani VPS serveringizdagi Nginx papkasiga (/etc/nginx/sites-available/maningiymonim.uz) joylang:
#
#   sudo cp docs/host-nginx.conf /etc/nginx/sites-available/maningiymonim.uz
#   sudo ln -s /etc/nginx/sites-available/maningiymonim.uz /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d maningiymonim.uz -d www.maningiymonim.uz
#   sudo systemctl reload nginx

server {
    listen 80;
    server_name maningiymonim.uz www.maningiymonim.uz;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Faqat host Nginx aniqlagan protokolni uzating; mijoz headerini ishonchli deb olmang.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
